name: Kernel Build (BakaSU + SUSFS / Neutron Clang)

on:
  push:
    branches:
      - Muse-Kernel
      - bakaKsu
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CCACHE_DIR: ~/.ccache
      BAKA_REF: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev ccache zip python3 patch zstd axel

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-muse-${{ github.ref_name }}
          restore-keys: |
            ccache-muse-

      - name: Cache Neutron Clang + toolchains + AnyKernel3
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains
            ~/AnyKernel3
          key: kernel-tools-neutron-v2
          restore-keys: |
            kernel-tools-neutron-

      - name: Integrate BakaSU (SUSFS v2.3.0 is in-tree)
        run: bash ./setup_bakasu_susfs.sh "$BAKA_REF"

      - name: Build kernel (Neutron Clang, fallback AOSP Clang)
        run: bash ./build.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: out/build.log
          if-no-files-found: ignore

      - name: Collect artifact path
        id: artifact
        run: |
          shopt -s nullglob
          ZIP_FILES=(~/AnyKernel3/*.zip)
          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "No zip artifact found in ~/AnyKernel3."
            exit 1
          fi
          ZIP_PATH="$(ls -t "${ZIP_FILES[@]}" | head -n 1)"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.zip_name }}
          path: ${{ steps.artifact.outputs.zip_path }}
